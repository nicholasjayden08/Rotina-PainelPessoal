# ===== Banco de dados H2 em ARQUIVO (persistente em disco, nao em memoria) =====
# Os dados ficam salvos em ./data/rotina.mv.db - sobrevivem a reinicios do servidor.
spring.datasource.url=jdbc:h2:file:./data/rotina;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
# update: cria/atualiza tabelas automaticamente a partir das entidades, sem apagar dados existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== Console H2 (acessar o banco direto no navegador para inspecionar dados) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===== Servidor =====
server.port=8080

# ===== Logging =====
logging.level.org.springframework.web=INFO
logging.level.com.nicholas.rotina=DEBUG
